<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revestimientos Tostado — Control de Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E7E4DD;
    --paper: #FCFBF8;
    --ink: #201E1E;
    --ink-soft: #6B6459;
    --line: #D8D3C7;
    --gold: #FFCC29;
    --gold-dark: #D9A800;
    --gold-tint: #FFF3CE;
    --brick: #9C3B22;
    --brick-dark: #7A2C19;
    --brick-tint: #F4E3DC;
    --steel: #33586B;
    --steel-tint: #DFE9EC;
    --amber: #B4791A;
    --amber-tint: #F6E7CC;
    --green: #3F7D5C;
    --green-tint: #DEEAE2;
    --red: #B23B2E;
    --red-tint: #F6DEDA;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(32,30,30,0.06), 0 4px 14px rgba(32,30,30,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg),var(--bg));
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    min-height:100vh;
  }
  ::selection{ background: var(--brick-tint); }
  .app{ display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar{
    width:216px; flex-shrink:0;
    background:var(--ink);
    color:#EDE9E1;
    padding:22px 14px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:0 8px 4px;
    border-bottom:1px solid rgba(255,255,255,0.14);
    padding-bottom:16px; margin-bottom:16px;
  }
  .brand img{ display:block; height:40px; width:auto; margin-bottom:10px;}
  .brand .company{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; line-height:1.25; color:#fff;}
  .brand small{ display:block; font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); margin-top:5px;}
  nav.tabs{ display:flex; flex-direction:column; gap:2px; }
  nav.tabs button{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px;
    font-size:13px; font-weight:500; color:#CFC8BC;
    transition:background .12s ease, color .12s ease;
  }
  nav.tabs button:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  nav.tabs button.active{ background:var(--gold); color:var(--ink); }
  nav.tabs .icon{ font-family:'IBM Plex Mono',monospace; font-size:11px; width:18px; text-align:center; opacity:.85;}
  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,0.14); font-size:11px; color:#8f8779; line-height:1.5;}
  .btn-export{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:8px;
    background:transparent; border:1.5px solid var(--gold); color:var(--gold);
    font-size:12px; font-weight:600; padding:9px 10px; border-radius:8px;
    margin-top:12px; transition:background .12s ease, color .12s ease;
  }
  .btn-export:hover{ background:var(--gold); color:var(--ink); }

  /* Main */
  .main{ flex:1; min-width:0; padding:26px 34px 60px; }
  .pagehead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .pagehead h1{ font-family:'Fraunces',serif; font-size:23px; font-weight:600; margin:0; }
  .pagehead .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:3px;}

  .btn{
    all:unset; cursor:pointer; font-family:'Inter',sans-serif;
    font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:7px;
    background:var(--gold); color:var(--ink); display:inline-flex; align-items:center; gap:6px;
    transition:background .12s ease;
  }
  .btn:hover{ background:var(--gold-dark); }
  .btn.secondary{ background:var(--paper); color:var(--ink); border:1px solid var(--line);}
  .btn.secondary:hover{ background:#F2EFE9;}
  .btn.small{ padding:5px 10px; font-size:11.5px;}
  .btn.ghost{ background:transparent; color:var(--steel); padding:5px 8px;}
  .btn.ghost:hover{ background:var(--steel-tint);}
  .btn.danger{ background:transparent; color:var(--red); padding:5px 8px;}
  .btn.danger:hover{ background:var(--red-tint);}

  .cards-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:22px;}
  .kpi{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; box-shadow:var(--shadow);
  }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;}
  .kpi .value{ font-family:'Fraunces',serif; font-size:23px; font-weight:600; margin-top:6px;}
  .kpi .value.pos{ color:var(--green); }
  .kpi .value.neg{ color:var(--red); }
  .kpi .note{ font-size:11px; color:var(--ink-soft); margin-top:4px;}

  .panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:20px;}
  .panel h2{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 12px;}
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}

  .alert-banner{ border-radius:var(--radius); padding:13px 16px; margin-bottom:18px; display:flex; gap:10px; align-items:flex-start; border:1px solid; }
  .alert-banner.warn{ background:var(--amber-tint); border-color:#e0c187; color:#6b4c0f;}
  .alert-banner.crit{ background:var(--red-tint); border-color:#e0a89f; color:#7a281d;}
  .alert-banner .stamp{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; border:1.5px solid currentColor; border-radius:5px; padding:2px 7px; white-space:nowrap;}
  .alert-banner ul{ margin:6px 0 0; padding-left:18px;}
  .alert-banner li{ margin-bottom:2px;}

  table{ width:100%; border-collapse:collapse; font-size:13px;}
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; padding:6px 10px; border-bottom:1.5px solid var(--line);}
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{ background:#F5F2EC; }
  td.num, th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .muted{ color:var(--ink-soft);}
  .tag{ display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:100px; letter-spacing:.02em;}
  .tag.cliente{ background:var(--steel-tint); color:var(--steel);}
  .tag.proveedor{ background:var(--brick-tint); color:var(--brick-dark);}
  .tag.ambos{ background:#EEE3EA; color:#7a3b63;}
  .tag.ok{ background:var(--green-tint); color:var(--green);}
  .tag.warn{ background:var(--amber-tint); color:var(--amber);}
  .tag.crit{ background:var(--red-tint); color:var(--red);}
  .tag.neutral{ background:#EFEBE3; color:var(--ink-soft);}

  .empty{ text-align:center; padding:34px 10px; color:var(--ink-soft); font-size:13px;}
  .empty .big{ font-family:'Fraunces',serif; font-size:16px; color:var(--ink); margin-bottom:4px;}

  .filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    font-family:'Inter',sans-serif; font-size:12.5px; padding:7px 9px; border-radius:7px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--steel); outline-offset:1px;}
  label.field{ display:flex; flex-direction:column; gap:4px; font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .form-grid.cols3{ grid-template-columns:repeat(3,1fr);}
  .form-grid .full{ grid-column:1/-1;}

  .modal-backdrop{ position:fixed; inset:0; background:rgba(38,34,29,0.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;}
  .modal{ background:var(--paper); border-radius:12px; width:100%; max-width:560px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal h3{ font-family:'Fraunces',serif; font-size:17px; margin:0 0 16px;}
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .modal .close{ float:right; }

  .client-card{ border:1px solid var(--line); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .client-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer; background:#fff;}
  .client-head:hover{ background:#F7F5EF;}
  .client-name{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px;}
  .client-body{ padding:0 14px 14px; background:#FBFAF6; border-top:1px solid var(--line);}
  .saldo-pill{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; }
  .obra-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--line);}
  .obra-row:last-child{ border-bottom:none;}
  .bar-wrap{ background:#EDE9E1; border-radius:5px; height:6px; width:140px; overflow:hidden;}
  .bar-fill{ height:100%; background:var(--green); border-radius:5px;}

  .linklike{ all:unset; cursor:pointer; color:var(--steel); font-size:inherit; }
  .linklike:hover{ text-decoration:underline; }
  .hist-item{ font-size:12px; color:var(--ink-soft); padding:4px 0; border-bottom:1px dotted var(--line);}
  .hist-item:last-child{ border-bottom:none;}

  .chart{ display:flex; align-items:flex-end; gap:10px; height:180px; padding:10px 4px 0; overflow-x:auto;}
  .chart .bar-group{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:52px;}
  .chart .bars{ display:flex; align-items:flex-end; gap:3px; height:140px;}
  .chart .bars .seg{ width:16px; border-radius:3px 3px 0 0;}
  .chart .seg.ingreso{ background:var(--green);}
  .chart .seg.egreso{ background:var(--brick);}
  .chart .glabel{ font-size:10px; color:var(--ink-soft); text-align:center; line-height:1.2;}
  .legend{ display:flex; gap:16px; font-size:11.5px; color:var(--ink-soft); margin-top:8px;}
  .legend span{ display:inline-flex; align-items:center; gap:5px;}
  .legend i{ width:9px; height:9px; border-radius:2px; display:inline-block;}

  .toast{ position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:12.5px; box-shadow:var(--shadow); z-index:100; opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s;}
  .toast.show{ opacity:1; transform:translateY(0);}
  .conn-badge{ position:fixed; top:0; left:0; right:0; text-align:center; padding:8px 14px; font-size:12.5px; font-weight:600; z-index:90; opacity:0; pointer-events:none; transform:translateY(-100%); transition:opacity .18s, transform .18s;}
  .conn-badge.show{ opacity:1; transform:translateY(0); pointer-events:auto;}
  .conn-badge.warn{ background:var(--amber-tint); color:#6b4c0f;}
  .conn-badge.crit{ background:var(--red-tint); color:#7a281d;}

  .segctrl{ display:flex; background:#EFEBE3; border-radius:8px; padding:3px; gap:2px;}
  .segctrl button{ all:unset; cursor:pointer; font-size:12px; font-weight:600; padding:6px 12px; border-radius:6px; color:var(--ink-soft);}
  .segctrl button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08);}

  ::-webkit-scrollbar{ height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{ background:#CFC8BC; border-radius:6px;}

  .mobile-topbar{ display:none; }

  @media (max-width:820px){
    .mobile-topbar{
      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:40;
      background:var(--ink); color:#fff; padding:12px 16px;
    }
    .mobile-topbar button{ all:unset; cursor:pointer; font-size:22px; line-height:1; color:#fff; padding:2px 4px;}
    .mobile-topbar .brand-mini{ font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
    .sidebar{
      display:flex; position:fixed; top:0; left:0; bottom:0; z-index:50;
      transform:translateX(-100%); transition:transform .2s ease; height:100vh;
    }
    .sidebar.open{ transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,0.4); }
    .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:45; }
    .sidebar-backdrop.show{ display:block; }
    .main{ padding:18px; }
    .form-grid, .form-grid.cols3{ grid-template-columns:1fr;}
  }
</style>
</head>

<div class="mobile-topbar" id="mobile-topbar">
  <button id="btn-open-menu">☰</button>
  <span class="brand-mini">Revestimientos Tostado</span>
</div>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">

<script>
/* ============ ESTADO Y CONEXIÓN CON LA BASE DE DATOS (Google Sheets) ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbz4VJ4hip4X9NTi7G3ed9_IkLEY1YWulNst69mXvt67KoEwmEUqtiDdcA8GxGVp0--o/exec';

let state = { entidades:[], obras:[], movimientos:[], cheques:[], deudas:[], settings:{ emailsRecordatorio:'', diasAnticipacion:3 }, activeTab:'dashboard', loaded:false, offline:false, searchEntidades:'', searchProveedores:'', searchCheques:'', cobranzasFiltro:{ estado:'', q:'', orden:'saldo_desc' }, provFiltro:{ desde:'', hasta:'' } };

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ n = Number(n)||0; return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n); }
function normDate(iso){ return String(iso||'').slice(0,10); } // por si llega con hora/zona pegada, nos quedamos solo con AAAA-MM-DD
function fmtDate(iso){ const s=normDate(iso); if(!s) return '—'; const [y,m,d]=s.split('-'); if(!y||!m||!d) return '—'; return `${d}/${m}/${y}`; }
function daysUntil(iso){ const t=new Date(todayISO()+'T00:00:00'); const d=new Date(normDate(iso)+'T00:00:00'); return Math.round((d-t)/86400000); }
function isoWeek(iso){ const d=new Date(normDate(iso)+'T00:00:00'); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day+3); const firstThu=new Date(d.getFullYear(),0,4); const week=1+Math.round(((d-firstThu)/86400000-3+((firstThu.getDay()+6)%7))/7); return `${d.getFullYear()}-S${String(week).padStart(2,'0')}`; }
function monthKey(iso){ return normDate(iso).slice(0,7); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function apiList(table){
  const res = await fetch(`${API_URL}?table=${encodeURIComponent(table)}`);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.rows || [];
}
async function apiUpsert(table, record){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // evita el preflight CORS de Apps Script
    body: JSON.stringify({ action:'upsert', table, record })
  });
  if(!res.ok) return false;
  const data = await res.json();
  return !!data.ok;
}
async function apiDeleteRow(table, id){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'delete', table, id })
  });
  if(!res.ok) return false;
  const data = await res.json();
  return !!data.ok;
}

/* ---- Caché local y cola de sincronización (para poder trabajar sin conexión) ---- */
const CACHE_PREFIX = 'rt_cache_';
const QUEUE_KEY = 'rt_pending_ops';
function cacheGetList(table){ try{ const v = localStorage.getItem(CACHE_PREFIX+table); return v? JSON.parse(v) : null; }catch(e){ return null; } }
function cacheSetList(table, rows){ try{ localStorage.setItem(CACHE_PREFIX+table, JSON.stringify(rows)); }catch(e){} }
function getQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} }
function pendingCount(){ return getQueue().length; }

function updateConnBadge(){
  const el = document.getElementById('conn-badge'); if(!el) return;
  const n = pendingCount();
  if(n>0){ el.textContent = `🔴 Sin conexión — ${n} cambio(s) guardados en esta computadora, esperando para sincronizar`; el.className='conn-badge show crit'; }
  else if(state.offline){ el.textContent = `🟡 Sin conexión — mostrando la última información guardada en esta computadora`; el.className='conn-badge show warn'; }
  else { el.className='conn-badge'; }
}

async function trySyncPending(){
  let q = getQueue();
  if(!q.length){ if(state.offline){ state.offline=false; } updateConnBadge(); return; }
  while(q.length){
    const op = q[0];
    let ok = false;
    try{
      ok = op.op==='upsert' ? await apiUpsert(op.table, op.record) : await apiDeleteRow(op.table, op.id);
    }catch(e){ ok = false; }
    if(!ok) break; // seguimos sin conexión: paramos acá para no desordenar la cola
    q.shift(); setQueue(q);
  }
  if(getQueue().length===0){ state.offline=false; showToast('Sincronizado con la nube ✅'); }
  updateConnBadge();
}
function scheduleAutoSync(){
  setInterval(trySyncPending, 20000);
  window.addEventListener('online', trySyncPending);
  window.addEventListener('offline', ()=>{ state.offline=true; updateConnBadge(); });
}

const TABLES = ['entidades','obras','movimientos','cheques','deudas'];
const DATE_FIELDS_BY_TABLE = { movimientos:['fecha'], obras:['fechaInicio'], cheques:['fechaEmision','fechaVencimiento','fechaEntrega'], deudas:['fechaFactura','fechaVencimiento'] };
function sanitizeDates_(table, rows){
  const fields = DATE_FIELDS_BY_TABLE[table] || [];
  if(fields.length) rows.forEach(r=> fields.forEach(f=>{ if(r[f]) r[f] = normDate(r[f]); }));
  return rows;
}
async function loadAll(){
  if(!API_URL || API_URL.includes('REEMPLAZAR')){
    document.getElementById('main').innerHTML = `<div class="empty"><div class="big">Falta configurar la conexión con la base de datos</div>Pedile a Claude que complete la URL de Apps Script en el código.</div>`;
    return;
  }
  let anyFailure = false;
  await Promise.all(TABLES.map(async t=>{
    try{ const rows = sanitizeDates_(t, await apiList(t)); state[t] = rows; cacheSetList(t, rows); }
    catch(e){ anyFailure = true; state[t] = sanitizeDates_(t, cacheGetList(t) || []); }
  }));
  try{
    const rows = await apiList('settings');
    const s = rows[0];
    state.settings = s ? { emailsRecordatorio:s.emailsRecordatorio||'', diasAnticipacion:Number(s.diasAnticipacion||3) } : { emailsRecordatorio:'', diasAnticipacion:3 };
    cacheSetList('settings', rows);
  }catch(e){
    anyFailure = true;
    const cached = cacheGetList('settings');
    const s = cached && cached[0];
    state.settings = s ? { emailsRecordatorio:s.emailsRecordatorio||'', diasAnticipacion:Number(s.diasAnticipacion||3) } : { emailsRecordatorio:'', diasAnticipacion:3 };
  }
  // reaplicar por encima cualquier cambio local todavía no sincronizado
  applyQueueOnTop_();
  state.offline = anyFailure || pendingCount()>0;
  state.loaded = true;
  render();
  updateConnBadge();
  scheduleAutoSync();
  trySyncPending();
}
function applyQueueOnTop_(){
  getQueue().forEach(op=>{
    if(op.table==='settings') return;
    if(!state[op.table]) return;
    if(op.op==='upsert'){
      const i = state[op.table].findIndex(r=>r.id===op.record.id);
      if(i>=0) state[op.table][i] = op.record; else state[op.table].push(op.record);
    } else if(op.op==='delete'){
      state[op.table] = state[op.table].filter(r=>r.id!==op.id);
    }
  });
}

/* Guarda un registro (crear o editar) de una tabla: actualiza el estado local
   ya lo tiene que haber hecho quien llama, esto solo sincroniza con el backend. */
async function saveRecord(table, record){
  const op = { op:'upsert', table, record };
  await sendOp_(op);
}
async function deleteRecord(table, id){
  const op = { op:'delete', table, id };
  await sendOp_(op);
}
async function saveSettings(){
  const record = { id:'global', emailsRecordatorio:state.settings.emailsRecordatorio, diasAnticipacion:state.settings.diasAnticipacion };
  await sendOp_({ op:'upsert', table:'settings', record });
}
async function sendOp_(op){
  try{
    const ok = op.op==='upsert' ? await apiUpsert(op.table, op.record) : await apiDeleteRow(op.table, op.id);
    if(ok){ state.offline = pendingCount()>0; updateConnBadge(); }
    else queueOp_(op);
  }catch(e){ queueOp_(op); }
}
function queueOp_(op){
  const q = getQueue(); q.push(op); setQueue(q);
  state.offline = true;
  showToast('Sin conexión: se guardó en esta computadora y se va a sincronizar solo.');
  updateConnBadge();
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'), 2600);
}

function exportExcel(){

  }));

  const shObras = state.obras.map(o=>({
    Cliente:nombreEntidad(o.entidadId), Obra:o.nombre,
    'Monto inicial':o.montoInicial, 'Monto actual':montoActualObra(o),

  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shObras), 'Obras');

  const shMov = state.movimientos.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>({
    Fecha:m.fecha, Tipo:m.tipo, Entidad:nombreEntidad(m.entidadId),
    Obra:m.obraId? (obra(m.obraId)?.nombre||'') : '', 'Medio de pago':m.medioPago,
    Monto:Number(m.monto), Concepto:m.concepto||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shMov), 'Movimientos');

  const shCheques = state.cheques.map(c=>({
    Direccion:c.direccion, Entidad:nombreEntidad(c.entidadId),
    'Entregado a':c.entregadoA? nombreEntidad(c.entregadoA):'', Numero:c.numero||'',
    Banco:c.banco||'', Monto:Number(c.monto), 'Fecha emisión':c.fechaEmision||'',
    'Fecha vencimiento':c.fechaVencimiento, Estado:c.estado, Notas:c.notas||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shCheques), 'Cheques');

  const shDeudas = state.deudas.map(d=>({
    Proveedor:nombreEntidad(d.proveedorId), Concepto:d.concepto,
    Obra:d.obraId? (obra(d.obraId)?.nombre||''):'', Monto:Number(d.monto),
    Pagado:pagadoDeuda(d), Saldo:saldoDeuda(d),
    'Fecha factura':d.fechaFactura||'', 'Fecha límite pago':d.fechaVencimiento||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shDeudas), 'Deudas a proveedores');

  const shPagos = [];
  state.deudas.forEach(d=>(d.pagos||[]).forEach(p=>shPagos.push({
    Proveedor:nombreEntidad(d.proveedorId), Deuda:d.concepto, Fecha:p.fecha,
    Monto:Number(p.monto), 'Medio de pago':p.medioPago
  })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shPagos), 'Pagos a proveedores');

  const fecha = todayISO();
  XLSX.writeFile(wb, `Revestimientos_Tostado_Base_de_Datos_${fecha}.xlsx`);
  showToast('Excel generado.');
}

/* ============ HELPERS DE DOMINIO ============ */
function entidad(id){ return state.entidades.find(e=>e.id===id); }
function nombreEntidad(id){ const e=entidad(id); return e? e.nombre : '—'; }
function obra(id){ return state.obras.find(o=>o.id===id); }
function clientes(){ return state.entidades.filter(e=>e.tipo==='cliente'||e.tipo==='ambos'); }
function proveedores(){ return state.entidades.filter(e=>e.tipo==='proveedor'||e.tipo==='ambos'); }

function montoActualObra(o){
  if(o.historial && o.historial.length) return o.historial[o.historial.length-1].montoNuevo;
  return o.montoInicial;
}
function ingresosObra(obraId){
  return state.movimientos.filter(m=>m.tipo==='ingreso' && m.obraId===obraId).reduce((s,m)=>s+Number(m.monto),0);
}
function saldoObra(o){ return montoActualObra(o) - ingresosObra(o.id); }
function obrasDeCliente(clienteId){ return state.obras.filter(o=>o.entidadId===clienteId); }
function saldoCliente(clienteId){ return obrasDeCliente(clienteId).reduce((s,o)=>s+saldoObra(o),0); }

function pagadoDeuda(d){ return (d.pagos||[]).reduce((s,p)=>s+Number(p.monto),0); }
function saldoDeuda(d){ return Number(d.monto) - pagadoDeuda(d); }
function deudasDeProveedor(pid){ return state.deudas.filter(d=>d.proveedorId===pid); }
function saldoProveedor(pid){ return deudasDeProveedor(pid).reduce((s,d)=>s+saldoDeuda(d),0); }

function chequesActivos(){ return state.cheques.filter(c=>c.estado==='pendiente'); }
function estadoVencimiento(iso){
  if(!iso) return {level:'neutral', label:'Sin fecha'};
  const d = daysUntil(iso);
  if(d<0) return {level:'crit', label:`Vencido hace ${Math.abs(d)}d`};
  if(d===0) return {level:'crit', label:'Vence hoy'};
  if(d<=7) return {level:'warn', label:`Vence en ${d}d`};
  return {level:'ok', label:`En ${d}d`};
}

function addDaysISO(iso, days){
  const d = new Date(normDate(iso)+'T00:00:00'); d.setDate(d.getDate()+days);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
const FIXED_REMINDER_EMAIL = 'Gabic22.gc@gmail.com'; // se invita siempre, además de los que se carguen en Configuración

function calendarLinkCheque(c){
  const anticipo = Number(state.settings.diasAnticipacion ?? 3);
  const inicio = addDaysISO(c.fechaVencimiento, -anticipo);
  const fin = addDaysISO(c.fechaVencimiento, -anticipo+1);
  const esCobrar = c.direccion==='recibido' && !c.entregadoA;
  const accion = esCobrar ? 'Cobrar cheque' : 'Pagar cheque';
  const contraparte = esCobrar ? nombreEntidad(c.entidadId) : nombreEntidad(c.entregadoA || c.entidadId);
  const title = `${accion} N° ${c.numero||'s/n'} — ${fmtMoney(c.monto)} (vence ${fmtDate(c.fechaVencimiento)})`;
  const details = `${accion} — ${contraparte}. Monto: ${fmtMoney(c.monto)}. Banco: ${c.banco||'—'}. Vencimiento real: ${fmtDate(c.fechaVencimiento)}. Cargado en el sistema de control de Revestimientos Tostado.`;
  const params = new URLSearchParams({ action:'TEMPLATE', text:title, dates:`${inicio}/${fin}`, details });
  const extra = (state.settings.emailsRecordatorio||'').split(',').map(s=>s.trim()).filter(Boolean);
  const emails = [...new Set([FIXED_REMINDER_EMAIL, ...extra])];
  params.set('add', emails.join(','));
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function wireSearchInput(id, stateKey){
  const el = document.getElementById(id);
  if(!el) return;
  el.oninput = ()=>{
    const pos = el.selectionStart;
    state[stateKey] = el.value;
    render();
    const el2 = document.getElementById(id);
    if(el2){ el2.focus(); el2.setSelectionRange(pos,pos); }
  };
}

function render(){
  renderNav();
  const main = document.getElementById('main');
  if(!state.loaded){ main.innerHTML = `<div class="empty">Cargando datos…</div>`; return; }
  if(state.activeTab==='dashboard') main.innerHTML = viewDashboard();
  else if(state.activeTab==='entidades') main.innerHTML = viewEntidades();
  else if(state.activeTab==='movimientos') main.innerHTML = viewMovimientos();
  else if(state.activeTab==='cheques') main.innerHTML = viewCheques();
  else if(state.activeTab==='proveedores') main.innerHTML = viewProveedores();
  else if(state.activeTab==='cobranzas') main.innerHTML = viewCobranzas();
  else if(state.activeTab==='ganancias') main.innerHTML = viewGanancias();

}

const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function weekLabelFromDate(iso){
  const d = new Date(normDate(iso)+'T00:00:00');
  const day = (d.getDay()+6)%7; // lunes=0
  const monday = new Date(d); monday.setDate(d.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = dt => `${dt.getDate()} ${MESES_CORTO[dt.getMonth()]}`;
  return `${fmt(monday)} – ${fmt(sunday)}`;
}
function monthLabelFromDate(iso){
  const [y,m] = normDate(iso).split('-');
  const nombre = MESES_LARGO[Number(m)-1] || '';
  return `${nombre.charAt(0).toUpperCase()+nombre.slice(1)} ${y}`;
}
function agruparMovimientos(keyFn, labelFn){
  const map = {};
  state.movimientos.forEach(m=>{
    const k = keyFn(m.fecha);
    if(!map[k]) map[k]={key:k, label:labelFn(m.fecha), ingreso:0, egreso:0};
    map[k][m.tipo] += Number(m.monto);
  });
  return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key));
}
function renderChart(data, unidad){
  if(!data.length) return `<div class="empty">Sin movimientos cargados todavía.</div>`;
  const max = Math.max(1,...data.map(d=>Math.max(d.ingreso,d.egreso)));
  return `<div class="chart">
    ${data.map(d=>`
      <div class="bar-group">
        <div class="bars">
          <div class="seg ingreso" style="height:${Math.max(2,(d.ingreso/max)*140)}px" title="Ingresos ${fmtMoney(d.ingreso)}"></div>
          <div class="seg egreso" style="height:${Math.max(2,(d.egreso/max)*140)}px" title="Egresos ${fmtMoney(d.egreso)}"></div>
        </div>
        <div class="glabel">${d.label}</div>
      </div>
    `).join('')}
  </div>
  <div class="legend"><span><i style="background:var(--green)"></i>Ingresos</span><span><i style="background:var(--brick)"></i>Egresos</span></div>`;
}

function totalCostosObra(o){ return (o.costos||[]).reduce((s,c)=>s+Number(c.monto),0); }
function renderObraRow(o){

      </div>
      <div id="costos-${o.id}" style="display:none;margin-top:8px;padding:10px;background:#F5F2EC;border-radius:8px">
        <div style="font-size:12px;margin-bottom:6px">
          <strong>Rentabilidad estimada (vs. monto inicial):</strong>
          Costos: ${fmtMoney(totalCostos)} · Ganancia: <span style="color:${ganancia>=0?'var(--green)':'var(--red)'}">${fmtMoney(ganancia)}</span> (${rentabilidad}%)
        </div>
        ${(o.costos||[]).length? (o.costos||[]).map(c=>`<div class="hist-item">${fmtDate(c.fecha)} — ${escapeHtml(c.concepto)}: ${fmtMoney(c.monto)} <button type="button" class="linklike" data-del-costo="${o.id}|${c.id}" style="color:var(--red);margin-left:6px">quitar</button></div>`).join('') : `<div class="muted" style="font-size:12px">Sin costos cargados todavía.</div>`}
        <button class="btn ghost small" data-add-costo="${o.id}" style="margin-top:6px">+ Costo</button>
      </div>
    </div>
    <div style="text-align:right">
      <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%; background:${saldo<0?'var(--steel)':'var(--green)'}"></div></div>
      <div style="font-size:12px;margin-top:4px" class="${saldo>0?'':''}">${saldo>0? 'Saldo '+fmtMoney(saldo) : saldo<0? 'A favor '+fmtMoney(-saldo) : 'Saldado'}</div>

        <button class="btn danger small" data-del-obra="${o.id}">Eliminar</button>
      </div>
    </div>
  </div>`;
}

function viewMovimientos(){
  const f = state.movFiltro || {};
  let list = state.movimientos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(f.entidadId) list = list.filter(m=>m.entidadId===f.entidadId);
  if(f.obraId) list = list.filter(m=>m.obraId===f.obraId);
  if(f.tipo) list = list.filter(m=>m.tipo===f.tipo);
  if(f.desde) list = list.filter(m=>m.fecha>=f.desde);
  if(f.hasta) list = list.filter(m=>m.fecha<=f.hasta);

  const totalIn = list.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+Number(m.monto),0);
  const totalOut = list.filter(m=>m.tipo==='egreso').reduce((s,m)=>s+Number(m.monto),0);

  const obrasFiltradas = f.entidadId ? state.obras.filter(o=>o.entidadId===f.entidadId) : state.obras;

  return `

        <select id="f-obra"><option value="">${f.entidadId? 'Todas las obras de este cliente':'Todas las obras'}</option>${obrasFiltradas.map(o=>`<option value="${o.id}" ${f.obraId===o.id?'selected':''}>${escapeHtml(o.nombre)}</option>`).join('')}</select>
        <select id="f-tipo"><option value="">Ingresos y egresos</option><option value="ingreso" ${f.tipo==='ingreso'?'selected':''}>Solo ingresos</option><option value="egreso" ${f.tipo==='egreso'?'selected':''}>Solo egresos</option></select>
        <input type="date" id="f-desde" value="${f.desde||''}" title="Desde">
        <input type="date" id="f-hasta" value="${f.hasta||''}" title="Hasta">
        <button class="btn secondary small" id="f-clear">Limpiar</button>
      </div>
      <div class="cards-row" style="margin-bottom:6px">
        <div class="kpi"><div class="label">Ingresos (filtro)</div><div class="value pos">${fmtMoney(totalIn)}</div></div>
        <div class="kpi"><div class="label">Egresos (filtro)</div><div class="value neg">${fmtMoney(totalOut)}</div></div>
        <div class="kpi"><div class="label">Resultado</div><div class="value ${(totalIn-totalOut)>=0?'pos':'neg'}">${fmtMoney(totalIn-totalOut)}</div></div>
      </div>
      ${list.length===0? `<div class="empty"><div class="big">No hay movimientos con estos filtros</div></div>` : `
      <table><thead><tr><th>Fecha</th><th>Tipo</th><th>Entidad</th><th>Obra</th><th>Medio</th><th class="num">Monto</th><th>Concepto</th><th></th></tr></thead><tbody>
        ${list.map(m=>`<tr>
          <td>${fmtDate(m.fecha)}</td>
          <td><span class="tag ${m.tipo==='ingreso'?'ok':'crit'}">${m.tipo}</span></td>
          <td>${escapeHtml(nombreEntidad(m.entidadId))}</td>
          <td class="muted">${m.obraId? escapeHtml(obra(m.obraId)?.nombre||'—') : '—'}</td>
          <td class="muted">${m.medioPago}${m.chequeId? ` <button class="btn ghost small" data-ver-cheque="${m.chequeId}" style="padding:2px 7px;font-size:11px">🔗 ver cheque</button>`:''}</td>
          <td class="num">${fmtMoney(m.monto)}</td>
          <td class="muted">${escapeHtml(m.concepto||'—')}</td>
          <td style="white-space:nowrap"><button class="btn ghost small" data-edit-mov="${m.id}">Editar</button> <button class="btn danger small" data-del-mov="${m.id}">Borrar</button></td>
        </tr>`).join('')}
      </tbody></table>`}
    </div>
  `;
}

/* ============ COBRANZAS ============ */
function filasCobranza(){
  return state.obras.map(o=>{
    const inicial = Number(o.montoInicial)||0;
    const actual = montoActualObra(o);
    const entregado = ingresosObra(o.id);
    const pctAvance = inicial>0 ? Math.round((entregado/inicial)*100) : (entregado>0? 100:0);
    const saldo = actual - entregado;
    const estado = saldo>0 ? 'debe' : (saldo<0 ? 'a_favor' : 'al_dia');
    return { obra:o, cliente: entidad(o.entidadId), inicial, actual, entregado, pctAvance, saldo, estado };
  }).filter(r=>r.cliente); // descarta obras huérfanas (cliente eliminado)
}
function viewCobranzas(){
  const f = state.cobranzasFiltro || { estado:'', q:'', orden:'saldo_desc' };
  let filas = filasCobranza();
  if(f.estado) filas = filas.filter(r=>r.estado===f.estado);
  const q = (f.q||'').trim().toLowerCase();
  if(q) filas = filas.filter(r=> r.cliente.nombre.toLowerCase().includes(q) || r.obra.nombre.toLowerCase().includes(q));
  if(f.orden==='saldo_desc') filas.sort((a,b)=>b.saldo-a.saldo);
  else if(f.orden==='avance_asc') filas.sort((a,b)=>a.pctAvance-b.pctAvance);
  else if(f.orden==='avance_desc') filas.sort((a,b)=>b.pctAvance-a.pctAvance);
  else if(f.orden==='cliente') filas.sort((a,b)=>a.cliente.nombre.localeCompare(b.cliente.nombre));

  const totalAdeudado = filasCobranza().filter(r=>r.estado==='debe').reduce((s,r)=>s+r.saldo,0);
  const cantDebe = filasCobranza().filter(r=>r.estado==='debe').length;

  return `
    <div class="pagehead">
      <div><h1>Cobranzas</h1><div class="sub">Avance de pago de cada obra (entregado vs. monto inicial) y quién todavía adeuda saldo.</div></div>
    </div>
    <div class="cards-row">
      <div class="kpi"><div class="label">Total adeudado</div><div class="value neg">${fmtMoney(totalAdeudado)}</div></div>
      <div class="kpi"><div class="label">Obras con saldo pendiente</div><div class="value">${cantDebe}</div></div>
    </div>
    <div class="panel">
      <div class="filters">
        <select id="cob-estado">
          <option value="">Todos los estados</option>
          <option value="debe" ${f.estado==='debe'?'selected':''}>Debe</option>
          <option value="al_dia" ${f.estado==='al_dia'?'selected':''}>Al día</option>
          <option value="a_favor" ${f.estado==='a_favor'?'selected':''}>Pagó de más (a favor)</option>
        </select>
        <select id="cob-orden">
          <option value="saldo_desc" ${f.orden==='saldo_desc'?'selected':''}>Ordenar: mayor saldo primero</option>
          <option value="avance_asc" ${f.orden==='avance_asc'?'selected':''}>Ordenar: menor % avance primero</option>
          <option value="avance_desc" ${f.orden==='avance_desc'?'selected':''}>Ordenar: mayor % avance primero</option>
          <option value="cliente" ${f.orden==='cliente'?'selected':''}>Ordenar: por cliente (A-Z)</option>
        </select>
        <input type="text" id="cob-q" placeholder="🔍 Buscar cliente u obra…" value="${escapeHtml(f.q||'')}">
      </div>
      ${filas.length===0? `<div class="empty"><div class="big">No hay obras que coincidan con estos filtros</div></div>` : `
      <table><thead><tr><th>Cliente</th><th>Obra</th><th class="num">Monto inicial</th><th class="num">Entregado</th><th class="num">% avance</th><th class="num">Saldo actual</th><th>Estado</th><th></th></tr></thead><tbody>
        ${filas.map(r=>`<tr>
          <td>${escapeHtml(r.cliente.nombre)}</td>
          <td class="muted">${escapeHtml(r.obra.nombre)}</td>
          <td class="num">${fmtMoney(r.inicial)}</td>
          <td class="num">${fmtMoney(r.entregado)}</td>
          <td class="num">${r.pctAvance}%</td>
          <td class="num" style="color:${r.saldo>0?'var(--brick)':r.saldo<0?'var(--green)':'inherit'}">${fmtMoney(r.saldo)}</td>
          <td><span class="tag ${r.estado==='debe'?'crit':r.estado==='a_favor'?'ok':'neutral'}">${r.estado==='debe'?'Debe':r.estado==='a_favor'?'A favor':'Al día'}</span></td>
          <td><button class="btn ghost small" data-ver-mov-obra="${r.obra.id}|${r.cliente.id}">Ver movimientos</button></td>
        </tr>`).join('')}
      </tbody></table>`}
    </div>
  `;
}

/* ============ CHEQUES ============ */
function viewCheques(){

  const cobrar = state.cheques.filter(c=>c.direccion==='recibido' && !c.entregadoA && c.estado==='pendiente').sort((a,b)=>(a.fechaVencimiento||'').localeCompare(b.fechaVencimiento||''));
  const pagar = state.cheques.filter(c=> (c.direccion==='emitido' || (c.direccion==='recibido' && c.entregadoA)) && c.estado==='pendiente').sort((a,b)=>(a.fechaVencimiento||'').localeCompare(b.fechaVencimiento||''));
  let list = sub==='cobrar'? cobrar : pagar;
  const q = (state.searchCheques||'').trim().toLowerCase();
  if(q){
    list = list.filter(c=>{
      const contraparte = sub==='cobrar'? nombreEntidad(c.entidadId) : (c.entregadoA? nombreEntidad(c.entregadoA) : nombreEntidad(c.entidadId));
      return (c.numero||'').toLowerCase().includes(q) || (c.banco||'').toLowerCase().includes(q) || contraparte.toLowerCase().includes(q);

        <label class="field" style="width:150px">Días de anticipación<input type="number" id="set-dias" min="0" value="${state.settings.diasAnticipacion ?? 3}"></label>

    </div>
    <div class="panel">
      ${list.length===0? `<div class="empty"><div class="big">${q? 'Ningún cheque coincide con la búsqueda' : 'No hay cheques en esta lista'}</div></div>` : `
      <table><thead><tr><th>Vencimiento</th><th>Estado</th><th>N°</th><th>Banco</th><th>${sub==='cobrar'?'Cliente':'A pagar a'}</th><th class="num">Monto</th><th></th></tr></thead><tbody>
        ${list.map(c=>{
          const ev = estadoVencimiento(c.fechaVencimiento);
          const contraparte = sub==='cobrar'? nombreEntidad(c.entidadId) : (c.entregadoA? nombreEntidad(c.entregadoA) : nombreEntidad(c.entidadId));
          return `<tr>
            <td>${fmtDate(c.fechaVencimiento)}</td>
            <td><span class="tag ${ev.level}">${ev.label}</span></td>
            <td class="muted">${escapeHtml(c.numero||'s/n')}</td>
            <td class="muted">${escapeHtml(c.banco||'—')}</td>
            <td>${escapeHtml(contraparte)}</td>

    <div class="panel">
      <h2>Historial (cobrados / pagados / rechazados)</h2>
      ${renderChequesHistorial(q)}

function renderChequesHistorial(q){
  let hist = state.cheques.filter(c=>c.estado!=='pendiente').sort((a,b)=>(b.fechaVencimiento||'').localeCompare(a.fechaVencimiento||''));
  if(q) hist = hist.filter(c=> (c.numero||'').toLowerCase().includes(q) || (c.banco||'').toLowerCase().includes(q) || nombreEntidad(c.entregadoA||c.entidadId).toLowerCase().includes(q));
  if(!hist.length) return `<div class="empty">${q? 'Ningún cheque del historial coincide con la búsqueda.' : 'Sin movimientos de cheques todavía.'}</div>`;
  return `<table><thead><tr><th>Vencimiento</th><th>Estado</th><th>N°</th><th>Entidad</th><th class="num">Monto</th><th></th></tr></thead><tbody>
    ${hist.map(c=>`<tr><td>${fmtDate(c.fechaVencimiento)}</td><td><span class="tag ${c.estado==='rechazado'?'crit':'ok'}">${c.estado}</span></td><td class="muted">${escapeHtml(c.numero||'s/n')}</td><td>${escapeHtml(nombreEntidad(c.entregadoA||c.entidadId))}</td><td class="num">${fmtMoney(c.monto)}</td>
    <td style="white-space:nowrap"><button class="btn ghost small" data-cheque-estado="${c.id}|pendiente">Reabrir</button> <button class="btn ghost small" data-edit-cheque="${c.id}">Editar</button> <button class="btn danger small" data-del-cheque="${c.id}">Eliminar</button></td></tr>`).join('')}
  </tbody></table>`;
}

    ${proveedores().length===0? `<div class="empty"><div class="big">Todavía no hay proveedores</div>Cargalos desde «Clientes y Obras».</div>` :

        <table><thead><tr><th>Concepto</th><th>Factura</th><th>Vence</th><th class="num">Monto</th><th class="num">Pagado</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
        ${deudas.map(d=>{
          const s = saldoDeuda(d);
          return `<tr>
            <td>${escapeHtml(d.concepto)}</td>
            <td class="muted">${fmtDate(d.fechaFactura)}</td>
            <td class="muted">${d.fechaVencimiento? fmtDate(d.fechaVencimiento):'—'}</td>
            <td class="num">${fmtMoney(d.monto)}</td>
            <td class="num">${fmtMoney(pagadoDeuda(d))}</td>

            </td>
          </tr>`;
        }).join('')}
        </tbody></table>`}
      </div>`;
    }).join('')}
  `;
}

/* ============ EVENTOS ============ */
function bindEvents(){
  const exportBtn = document.getElementById('btn-export-excel');
  if(exportBtn) exportBtn.onclick = exportExcel;
  const syncBtn = document.getElementById('btn-sync-now');
  if(syncBtn) syncBtn.onclick = async ()=>{ showToast('Sincronizando…'); await trySyncPending(); await loadAll(); };
  document.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>{
    const target = b.dataset.open;
    if(target==='modal-entidad') openModal(modalEntidad(null));
    if(target==='modal-obra') openModal(modalObra(null));
    if(target==='modal-movimiento') openModal(modalMovimiento(null));
    if(target==='modal-cheque') openModal(modalCheque(null));
    if(target==='modal-deuda') openModal(modalDeuda(null));
    bindModalEvents();
  });
  document.querySelectorAll('[data-edit-entidad]').forEach(b=> b.onclick = ()=>{ openModal(modalEntidad(b.dataset.editEntidad)); bindModalEvents(); });
  document.querySelectorAll('[data-new-obra-for]').forEach(b=> b.onclick = ()=>{ openModal(modalObra(b.dataset.newObraFor)); bindModalEvents(); });
  document.querySelectorAll('[data-modif-obra]').forEach(b=> b.onclick = ()=>{ openModal(modalModifObra(b.dataset.modifObra)); bindModalEvents(); });
  document.querySelectorAll('[data-edit-obra]').forEach(b=> b.onclick = ()=>{ openModal(modalObraEdit(b.dataset.editObra)); bindModalEvents(); });
  document.querySelectorAll('[data-del-obra]').forEach(b=> b.onclick = ()=>{ if(confirm('¿Eliminar esta obra? Los movimientos ya cargados no se borran, pero quedarán sin obra asociada.')){ const id=b.dataset.delObra; state.movimientos.forEach(m=>{ if(m.obraId===id){ m.obraId=null; saveRecord('movimientos', m); } }); state.obras = state.obras.filter(o=>o.id!==id); deleteRecord('obras', id); render(); showToast('Obra eliminada.'); } });
  document.querySelectorAll('[data-toggle-client]').forEach(b=> b.onclick = ()=>{ const id=b.dataset.toggleClient; const el=document.getElementById('body-'+id); el.style.display = el.style.display==='none'?'block':'none'; });
  document.querySelectorAll('[data-hist]').forEach(a=> a.onclick = (e)=>{ e.preventDefault(); const el=document.getElementById('hist-'+a.dataset.hist); el.style.display = el.style.display==='none'?'block':'none'; });
  document.querySelectorAll('[data-costos]').forEach(a=> a.onclick = (e)=>{ e.preventDefault(); const el=document.getElementById('costos-'+a.dataset.costos); el.style.display = el.style.display==='none'?'block':'none'; });
  document.querySelectorAll('[data-add-costo]').forEach(b=> b.onclick = ()=>{ openModal(modalCosto(b.dataset.addCosto)); bindModalEvents(); });
  document.querySelectorAll('[data-del-costo]').forEach(a=> a.onclick = (e)=>{ e.preventDefault(); const [obraId, costoId] = a.dataset.delCosto.split('|'); const o = obra(obraId); o.costos = (o.costos||[]).filter(c=>c.id!==costoId); saveRecord('obras', o); render(); showToast('Costo eliminado.'); });
  document.querySelectorAll('[data-del-mov]').forEach(b=> b.onclick = ()=>{ if(confirm('¿Borrar este movimiento?')){ const id=b.dataset.delMov; state.movimientos = state.movimientos.filter(m=>m.id!==id); deleteRecord('movimientos', id); render(); } });
  document.querySelectorAll('[data-edit-mov]').forEach(b=> b.onclick = ()=>{ openModal(modalMovimiento(b.dataset.editMov)); bindModalEvents(); });
  document.querySelectorAll('[data-cheque-sub]').forEach(b=> b.onclick = ()=>{ state.chequesSub = b.dataset.chequeSub; render(); });
  document.querySelectorAll('[data-gan-modo]').forEach(b=> b.onclick = ()=>{ state.gananciaModo = b.dataset.ganModo; render(); });
  document.querySelectorAll('[data-cheque-entregar]').forEach(b=> b.onclick = ()=>{ openModal(modalEntregarCheque(b.dataset.chequeEntregar)); fillDeudaOptions(); bindModalEvents(); });
  document.querySelectorAll('[data-cheque-estado]').forEach(b=> b.onclick = ()=>{
    const [id,estado] = b.dataset.chequeEstado.split('|');
    const c = state.cheques.find(x=>x.id===id); c.estado = estado; saveRecord('cheques', c);
    showToast('Cheque actualizado.'); render();
  });
  document.querySelectorAll('[data-pagar-deuda]').forEach(b=> b.onclick = ()=>{ openModal(modalPagarDeuda(b.dataset.pagarDeuda)); bindModalEvents(); });
  document.querySelectorAll('[data-edit-cheque]').forEach(b=> b.onclick = ()=>{ openModal(modalCheque(b.dataset.editCheque)); bindModalEvents(); });
  document.querySelectorAll('[data-del-cheque]').forEach(b=> b.onclick = ()=>{ if(confirm('¿Eliminar este cheque?')){ const id=b.dataset.delCheque; state.cheques = state.cheques.filter(c=>c.id!==id); state.movimientos.forEach(m=>{ if(m.chequeId===id){ m.chequeId=null; saveRecord('movimientos', m); } }); deleteRecord('cheques', id); render(); showToast('Cheque eliminado.'); } });
  document.querySelectorAll('[data-edit-deuda]').forEach(b=> b.onclick = ()=>{ openModal(modalDeuda(b.dataset.editDeuda)); bindModalEvents(); });
  document.querySelectorAll('[data-del-deuda]').forEach(b=> b.onclick = ()=>{ if(confirm('¿Eliminar esta factura/deuda? Se perderán también sus pagos registrados.')){ const id=b.dataset.delDeuda; state.deudas = state.deudas.filter(d=>d.id!==id); deleteRecord('deudas', id); render(); showToast('Deuda eliminada.'); } });

  // filtros de movimientos (vinculados entre sí: elegir cliente recorta las obras, y elegir obra completa el cliente)
  const fe=document.getElementById('f-entidad'), fo=document.getElementById('f-obra'), ft=document.getElementById('f-tipo'), fd=document.getElementById('f-desde'), fh=document.getElementById('f-hasta'), fc=document.getElementById('f-clear');
  if(fe){
    [fe,fo,ft,fd,fh].forEach(el=> el.onchange = ()=>{
      let entidadId = fe.value, obraId = fo.value;
      if(el===fe){
        if(obraId){ const o = obra(obraId); if(!entidadId || (o && o.entidadId!==entidadId)) obraId=''; }
      } else if(el===fo){
        if(obraId){ const o = obra(obraId); if(o) entidadId = o.entidadId; }
      }
      state.movFiltro = { entidadId, obraId, tipo:ft.value, desde:fd.value, hasta:fh.value };
      render();
    });
    fc.onclick = ()=>{ state.movFiltro={}; render(); };
  }

  wireSearchInput('search-entidades', 'searchEntidades');
  wireSearchInput('search-proveedores', 'searchProveedores');
  const provDesde=document.getElementById('prov-desde'), provHasta=document.getElementById('prov-hasta'), provClear=document.getElementById('prov-clear-fechas');
  if(provDesde){ [provDesde,provHasta].forEach(el=> el.onchange = ()=>{ state.provFiltro = { desde:provDesde.value, hasta:provHasta.value }; render(); }); }
  if(provClear) provClear.onclick = ()=>{ state.provFiltro = {desde:'', hasta:''}; render(); };
  wireSearchInput('search-cheques', 'searchCheques');

  const cobEstado=document.getElementById('cob-estado'), cobOrden=document.getElementById('cob-orden'), cobQ=document.getElementById('cob-q');
  if(cobEstado){ [cobEstado,cobOrden].forEach(el=> el.onchange = ()=>{ state.cobranzasFiltro = { estado:cobEstado.value, orden:cobOrden.value, q:(state.cobranzasFiltro&&state.cobranzasFiltro.q)||'' }; render(); }); }
  if(cobQ){ cobQ.oninput = ()=>{
    const pos = cobQ.selectionStart;
    state.cobranzasFiltro = { estado:(state.cobranzasFiltro&&state.cobranzasFiltro.estado)||'', orden:(state.cobranzasFiltro&&state.cobranzasFiltro.orden)||'saldo_desc', q:cobQ.value };
    render();
    const el2 = document.getElementById('cob-q');
    if(el2){ el2.focus(); el2.setSelectionRange(pos,pos); }
  }; }
  document.querySelectorAll('[data-ver-mov-obra]').forEach(b=> b.onclick = ()=>{
    const [obraId, entidadId] = b.dataset.verMovObra.split('|');
    state.movFiltro = { entidadId, obraId, tipo:'', desde:'', hasta:'' };
    state.activeTab = 'movimientos';
    render();
  });
  document.querySelectorAll('[data-ver-cheque]').forEach(b=> b.onclick = ()=>{
    const id = b.dataset.verCheque;
    const c = state.cheques.find(x=>x.id===id);
    if(!c){ showToast('Ese cheque ya no existe (puede haber sido eliminado).'); return; }
    state.activeTab = 'cheques';
    state.chequesSub = (c.direccion==='recibido' && !c.entregadoA) ? 'cobrar' : 'pagar';
    state.searchCheques = c.numero || '';
    render();
  });

  const btnSaveSettings = document.getElementById('btn-save-settings');
  if(btnSaveSettings) btnSaveSettings.onclick = async ()=>{
    const emails = document.getElementById('set-emails').value.trim();
    const dias = Number(document.getElementById('set-dias').value || 0);
    state.settings = { emailsRecordatorio: emails, diasAnticipacion: dias };
    await saveSettings();
    showToast('Configuración de recordatorios guardada.');
    render();
  };
}
function fillDeudaOptions(){
  const sel = document.querySelector('#form-entregar-cheque select[name=proveedorId]');
  if(!sel) return;
  const deudaSel = document.querySelector('#form-entregar-cheque select[name=deudaId]');
  function refresh(){ const pid=sel.value; const ds = deudasDeProveedor(pid).filter(d=>saldoDeuda(d)>0); deudaSel.innerHTML = `<option value="">— Ninguna —</option>` + ds.map(d=>`<option value="${d.id}">${escapeHtml(d.concepto)} — saldo ${fmtMoney(saldoDeuda(d))}</option>`).join(''); }
  sel.onchange = refresh; refresh();
}
function bindModalEvents(){
  const cancel = document.getElementById('btn-cancel'); if(cancel) cancel.onclick = closeModal;

  const fEnt = document.getElementById('form-entidad');
  if(fEnt){
    fEnt.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fEnt);
      const data = { nombre:fd.get('nombre').trim(), tipo:fd.get('tipo'), contacto:fd.get('contacto').trim(), notas:fd.get('notas').trim() };
      const id = fEnt.dataset.id;
      let rec;
      if(id){ rec = entidad(id); Object.assign(rec, data); } else { rec = {id:uid(), ...data}; state.entidades.push(rec); }
      saveRecord('entidades', rec); closeModal(); render(); showToast('Entidad guardada.');
    };
    const delBtn = document.getElementById('btn-del-entidad');
    if(delBtn) delBtn.onclick = ()=>{ const id=fEnt.dataset.id; if(confirm('¿Eliminar esta entidad? No se borrarán sus movimientos históricos.')){ state.entidades = state.entidades.filter(e=>e.id!==id); deleteRecord('entidades', id); closeModal(); render(); } };
  }

  const fObra = document.getElementById('form-obra');
  if(fObra) fObra.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fObra);
    const rec = { id:uid(), entidadId:fd.get('entidadId'), nombre:fd.get('nombre').trim(), montoInicial:Number(fd.get('montoInicial')), historial:[], costos:[], fechaInicio:fd.get('fechaInicio')||todayISO(), estado:'activa' };
    state.obras.push(rec);
    saveRecord('obras', rec); closeModal(); render(); showToast('Obra creada.');
  };

  const fCosto = document.getElementById('form-costo');
  if(fCosto) fCosto.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fCosto); const o = obra(fCosto.dataset.obraId);
    o.costos = o.costos||[];
    o.costos.push({ id:uid(), concepto:fd.get('concepto').trim(), monto:Number(fd.get('monto')), fecha:fd.get('fecha')||todayISO() });
    saveRecord('obras', o); closeModal(); render(); showToast('Costo agregado.');
  };

  const fModif = document.getElementById('form-modif-obra');
  if(fModif) fModif.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fModif); const o = obra(fModif.dataset.obraId);
    const anterior = montoActualObra(o);
    o.historial = o.historial||[]; o.historial.push({ fecha:fd.get('fecha')||todayISO(), montoAnterior:anterior, montoNuevo:Number(fd.get('montoNuevo')), motivo:fd.get('motivo').trim() });
    saveRecord('obras', o); closeModal(); render(); showToast('Monto de obra actualizado.');
  };

  const fObraEdit = document.getElementById('form-obra-edit');
  if(fObraEdit) fObraEdit.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fObraEdit); const o = obra(fObraEdit.dataset.id);
    o.entidadId = fd.get('entidadId'); o.nombre = fd.get('nombre').trim(); o.montoInicial = Number(fd.get('montoInicial')); o.fechaInicio = fd.get('fechaInicio'); o.estado = fd.get('estado');
    saveRecord('obras', o); closeModal(); render(); showToast('Obra actualizada.');
  };

  const fMov = document.getElementById('form-movimiento');
  if(fMov){
    // mostrar/ocultar el bloque de cheque según el medio de pago elegido
    const medioSel = document.getElementById('mov-medio');
    const chequeBlock = document.getElementById('mov-cheque-block');
    if(medioSel && chequeBlock){
      medioSel.onchange = ()=>{ chequeBlock.style.display = medioSel.value==='cheque' ? 'block' : 'none'; };
    }
    const btnNuevo = document.getElementById('cheque-modo-nuevo');
    const btnExistente = document.getElementById('cheque-modo-existente');
    const blockNuevo = document.getElementById('cheque-modo-block-nuevo');
    const blockExistente = document.getElementById('cheque-modo-block-existente');
    if(btnNuevo && btnExistente){
      btnNuevo.onclick = ()=>{ btnNuevo.classList.add('active'); btnExistente.classList.remove('active'); blockNuevo.style.display='block'; blockExistente.style.display='none'; };
      btnExistente.onclick = ()=>{ btnExistente.classList.add('active'); btnNuevo.classList.remove('active'); blockExistente.style.display='block'; blockNuevo.style.display='none'; };
    }

    fMov.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fMov);
      const esCheque = fd.get('medioPago')==='cheque';
      const modoNuevo = esCheque && btnNuevo && btnNuevo.classList.contains('active');
      let chequeId = fd.get('chequeId') || null;

      if(esCheque && modoNuevo){
        const venc = fd.get('chVencimiento');
        if(!venc){ alert('Para cargar un cheque nuevo hace falta la fecha de vencimiento.'); return; }
        const tipoMov = fd.get('tipo');
        const chequeRec = {
          id: uid(),
          direccion: tipoMov==='ingreso' ? 'recibido' : 'emitido',
          entidadId: fd.get('entidadId'),
          numero: (fd.get('chNumero')||'').trim(),
          banco: (fd.get('chBanco')||'').trim(),
          monto: Number(fd.get('monto')),
          fechaEmision: fd.get('fecha') || todayISO(),
          fechaVencimiento: venc,
          estado: 'pendiente',
          entregadoA: null,
          notas: ''
        };
        state.cheques.push(chequeRec);
        saveRecord('cheques', chequeRec);
        chequeId = chequeRec.id;
      }

      const data = { fecha:fd.get('fecha'), tipo:fd.get('tipo'), entidadId:fd.get('entidadId'), obraId:fd.get('obraId')||null, medioPago:fd.get('medioPago'), monto:Number(fd.get('monto')), concepto:fd.get('concepto').trim(), chequeId };
      const id = fMov.dataset.id;
      let rec;
      if(id){ rec = state.movimientos.find(m=>m.id===id); Object.assign(rec, data); } else { rec = { id:uid(), ...data }; state.movimientos.push(rec); }
      saveRecord('movimientos', rec); closeModal(); render(); showToast(esCheque && modoNuevo ? 'Movimiento y cheque guardados.' : 'Movimiento guardado.');
    };
  }

  const fCheque = document.getElementById('form-cheque');
  if(fCheque) fCheque.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fCheque);
    const data = { direccion:fd.get('direccion'), entidadId:fd.get('entidadId'), numero:fd.get('numero').trim(), banco:fd.get('banco').trim(), monto:Number(fd.get('monto')), fechaEmision:fd.get('fechaEmision'), fechaVencimiento:fd.get('fechaVencimiento'), notas:fd.get('notas').trim() };
    const id = fCheque.dataset.id;
    let rec;
    if(id){ rec = state.cheques.find(c=>c.id===id); Object.assign(rec, data); } else { rec = { id:uid(), ...data, estado:'pendiente', entregadoA:null }; state.cheques.push(rec); }
    saveRecord('cheques', rec); closeModal(); render(); showToast('Cheque guardado.');
  };

  const fEntregar = document.getElementById('form-entregar-cheque');
  if(fEntregar) fEntregar.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fEntregar); const c = state.cheques.find(x=>x.id===fEntregar.dataset.chequeId);
    c.entregadoA = fd.get('proveedorId'); c.fechaEntrega = fd.get('fechaEntrega')||todayISO();
    saveRecord('cheques', c);
    const deudaId = fd.get('deudaId');
    if(deudaId){ const d = state.deudas.find(x=>x.id===deudaId); d.pagos = d.pagos||[]; d.pagos.push({ fecha:c.fechaEntrega, monto:Number(c.monto), medioPago:'cheque', chequeId:c.id }); saveRecord('deudas', d); }
    closeModal(); render(); showToast('Cheque entregado al proveedor.');
  };

  const fDeuda = document.getElementById('form-deuda');
  if(fDeuda) fDeuda.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fDeuda);
    const data = { proveedorId:fd.get('proveedorId'), concepto:fd.get('concepto').trim(), obraId:fd.get('obraId')||null, monto:Number(fd.get('monto')), fechaFactura:fd.get('fechaFactura'), fechaVencimiento:fd.get('fechaVencimiento')||null };
    const id = fDeuda.dataset.id;
    let rec;
    if(id){ rec = state.deudas.find(x=>x.id===id); Object.assign(rec, data); } else { rec = { id:uid(), ...data, estado:'pendiente', pagos:[] }; state.deudas.push(rec); }
    saveRecord('deudas', rec); closeModal(); render(); showToast('Deuda guardada.');
  };

  const fPagar = document.getElementById('form-pagar-deuda');
  if(fPagar) fPagar.onsubmit = (e)=>{ e.preventDefault(); const fd=new FormData(fPagar); const d = state.deudas.find(x=>x.id===fPagar.dataset.deudaId);
    const monto = Number(fd.get('monto')); const fecha = fd.get('fecha')||todayISO(); const medioPago = fd.get('medioPago');
    d.pagos = d.pagos||[]; d.pagos.push({ fecha, monto, medioPago });
    const movRec = { id:uid(), fecha, tipo:'egreso', entidadId:d.proveedorId, obraId:d.obraId||null, medioPago, monto, concepto:'Pago — '+d.concepto, chequeId:null };
    state.movimientos.push(movRec);
    saveRecord('deudas', d); saveRecord('movimientos', movRec); closeModal(); render(); showToast('Pago registrado.');
  };

}

document.addEventListener('DOMContentLoaded', loadAll);
</script>
